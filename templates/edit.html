<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Edit Data Pendaftar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard">LABAMEN ADMIN</a>
        <a href="/dashboard" class="btn btn-outline-light rounded-pill">Kembali</a>
    </div>
</nav>

<section class="form-section py-5">
    <div class="container">
        <div class="form-card mx-auto">
            <h2 class="section-title text-center">Edit Data Pendaftar</h2>

            <form action="/edit/{{ peserta[0] }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" name="nama" class="form-control" value="{{ peserta[1] }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">NIM</label>
                    <input type="text" name="nim" class="form-control" value="{{ peserta[2] }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Program Studi</label>
                    <input type="text" name="prodi" class="form-control" value="{{ peserta[3] }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ peserta[4] }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">No. WhatsApp</label>
                    <input type="text" name="whatsapp" class="form-control" value="{{ peserta[5] }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Pilihan Divisi</label>
                    <select name="divisi" class="form-select" required>
                        <option value="{{ peserta[6] }}">{{ peserta[6] }}</option>
                        <option value="Administrasi">Administrasi</option>
                        <option value="Media Kreatif">Media Kreatif</option>
                        <option value="Acara">Acara</option>
                        <option value="Public Relation">Public Relation</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Alasan Bergabung</label>
                    <textarea name="alasan" class="form-control" rows="4" required>{{ peserta[7] }}</textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label">Status Seleksi</label>
                    <select name="status" class="form-select">
                        <option value="{{ peserta[9] }}">{{ peserta[9] }}</option>
                        <option value="Diproses">Diproses</option>
                        <option value="Lolos">Lolos</option>
                        <option value="Tidak Lolos">Tidak Lolos</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">
                    Simpan Perubahan
                </button>
            </form>
        </div>
    </div>
</section>

</body>
</html>
