<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Admin Labamen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">LABAMEN</a>
        <a href="/" class="btn btn-outline-light rounded-pill">Kembali</a>
    </div>
</nav>

<section class="form-section py-5">
    <div class="container">
        <div class="form-card mx-auto">
            <h2 class="section-title text-center">Login Admin</h2>
            <p class="text-muted text-center mb-4">
                Masukkan username dan password untuk mengakses dashboard admin.
            </p>

            {% if error %}
            <div class="alert alert-danger text-center">
                {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">
                    Login
                </button>
            </form>
        </div>
    </div>
</section>

</body>
</html>
